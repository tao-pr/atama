[package]
name = "atama"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive"] }
serde_json = "1.0.154"
ureq = "3.4.2"

# tests/cli.rs opens a pseudo-terminal to test colored output.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2.190"
